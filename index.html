<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>A Little Something For You</title>
</head>
<body>
<div class="rain" aria-hidden="true"></div>
<div class="petals" aria-hidden="true">
<span class="petal" style="--x:8%;--d:11s;--delay:0s"></span><span class="petal" style="--x:22%;--d:14s;--delay:3s"></span>
<span class="petal" style="--x:38%;--d:12s;--delay:6s"></span><span class="petal" style="--x:55%;--d:15s;--delay:1s"></span>
<span class="petal" style="--x:68%;--d:10s;--delay:4s"></span><span class="petal" style="--x:80%;--d:13s;--delay:7s"></span>
<span class="petal" style="--x:92%;--d:12s;--delay:2s"></span><span class="petal" style="--x:46%;--d:16s;--delay:9s"></span>
</div>
<main class="page">
  <section class="card" aria-labelledby="t">
    <div class="corner tl sway" aria-hidden="true">🌼<span class="fmn"></span></div>
    <div class="corner tr sway" style="animation-delay:-1.5s" aria-hidden="true"><span class="fmn"></span>🌼</div>
    <div class="corner bl sway" style="animation-delay:-3s" aria-hidden="true">🌼<span class="fmn"></span></div>
    <div class="corner br sway" style="animation-delay:-2s" aria-hidden="true"><span class="fmn"></span>🌼</div>
    <p class="kicker rise" style="--t:.2s">a little garden of love</p>
    <h1 id="t" class="title rise" style="--t:.6s">A Little Something For You</h1>
    <p class="hand rise" style="--t:1s;font-size:1.9rem">Happy Birthday, My Favorite Person!</p>
    <p class="lead rise" style="--t:1.4s">I made something special just for you.</p>
    <div class="rise" style="--t:1.8s"><a class="btn" href="gallery.html">Open Your Gift <span class="heart" aria-hidden="true">💗</span></a></div>
    <div class="flower-row rise" style="--t:2.2s;margin:var(--s3) 0 0" aria-hidden="true">
      <span class="deco float">🐱</span><span class="deco wiggle">⭐</span><span class="fmn"></span><span class="deco float" style="animation-delay:-2s">🦖</span><span class="deco wiggle">💗</span>
    </div>
  </section>
</main>
</body>
</html>
